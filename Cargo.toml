[package]
name = "ventarus"
version = "0.2.0"
edition = "2021"
description = "Plug in an Android phone and it is mirrored fullscreen in a blink (scrcpy launcher)"
readme = "README.md"

[dependencies]
ctrlc = { version = "3", features = ["termination"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
