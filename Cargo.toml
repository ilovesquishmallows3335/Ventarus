[package]
name = "ventarus"
version = "0.3.0"
edition = "2021"
description = "Fast Android phone mirroring launcher for scrcpy"
readme = "README.md"

[dependencies]
ctrlc = { version = "3", features = ["termination"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
